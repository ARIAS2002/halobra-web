<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Correo confirmado — Halobra</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#071726">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#071726;--naranja:#F26522;--verde:#17994A;
  --claro:#E8EEF4;--tenue:#8FA2B5;--borde:rgba(255,255,255,.10);--borde-fuerte:rgba(255,255,255,.20);
  --display:"Archivo",system-ui,sans-serif;--cuerpo:"Source Sans 3",system-ui,sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0;background:var(--fondo);color:var(--claro);
  font-family:var(--cuerpo);font-size:17px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;flex-direction:column;
}
a{color:var(--naranja);}
:focus-visible{outline:3px solid var(--naranja);outline-offset:3px;border-radius:4px;}

.tope{padding:26px 24px;border-bottom:1px solid var(--borde);}
.tope .fila{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:16px;}
.marca{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:1.6px;color:#fff;text-decoration:none;margin-right:auto;}
.marca em{color:var(--naranja);font-style:normal;}
.idioma{display:flex;border:1px solid var(--borde-fuerte);border-radius:999px;overflow:hidden;}
.idioma button{font-family:var(--display);font-weight:700;font-size:11.5px;letter-spacing:1px;padding:6px 12px;border:0;background:transparent;color:var(--tenue);cursor:pointer;}
.idioma button[aria-pressed="true"]{background:var(--naranja);color:#fff;}

main{
  flex:1;display:grid;place-items:center;
  padding:64px 24px 80px;position:relative;overflow:hidden;
}
main::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(52% 46% at 50% 8%,rgba(23,153,74,.16) 0%,transparent 68%);
  pointer-events:none;
}
.centro{position:relative;max-width:520px;text-align:center;}

.sello{
  width:88px;height:88px;border-radius:50%;margin:0 auto 30px;
  display:grid;place-items:center;
  background:rgba(23,153,74,.14);border:1.5px solid rgba(23,153,74,.45);
}
.sello svg{display:block;}
.marca-tic{stroke-dasharray:40;stroke-dashoffset:40;animation:tildar .55s ease .25s forwards;}
@keyframes tildar{to{stroke-dashoffset:0;}}
.sello{animation:brotar .45s cubic-bezier(.2,.9,.3,1.3) both;}
@keyframes brotar{from{transform:scale(.72);opacity:0;}to{transform:scale(1);opacity:1;}}

h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,4.4vw,38px);letter-spacing:-.7px;margin:0 0 14px;}
.destacado{font-size:19px;color:#fff;margin:0 0 20px;}
p{color:var(--tenue);margin:0 0 12px;}
.cerrar{font-size:15px;color:#6F8296;margin-top:26px;}

.pie{border-top:1px solid var(--borde);padding:26px 24px;text-align:center;font-size:14px;color:var(--tenue);}
.pie a{color:#B9C7D4;text-decoration:none;margin:0 9px;}
.pie a:hover{color:#fff;text-decoration:underline;}
.pie .derechos{display:block;margin-top:9px;color:#6F8296;}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;}
  .marca-tic{stroke-dashoffset:0;}
}
</style>
</head>
<body>

<div class="tope">
  <div class="fila">
    <a class="marca" href="index.html">HALO<em>BRA</em></a>
    <div class="idioma" role="group" aria-label="Idioma / Language">
      <button type="button" data-set="es" aria-pressed="true">ES</button>
      <button type="button" data-set="en" aria-pressed="false">EN</button>
    </div>
  </div>
</div>

<main>
  <div class="centro">
    <div class="sello">
      <svg width="42" height="42" viewBox="0 0 42 42" fill="none" aria-hidden="true">
        <path class="marca-tic" d="M10 21.5l8 8 14-16"
              stroke="#3FBF74" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1 data-es="Correo confirmado" data-en="Email confirmed">Correo confirmado</h1>
    <p class="destacado" data-es="Tu cuenta de Halobra ya está lista." data-en="Your Halobra account is ready.">Tu cuenta de Halobra ya está lista.</p>
    <p data-es="Vuelve a la aplicación y entra con tu correo y tu contraseña."
       data-en="Go back to the app and sign in with your email and password.">
      Vuelve a la aplicación y entra con tu correo y tu contraseña.
    </p>
    <p class="cerrar" data-es="Ya puedes cerrar esta página." data-en="You can close this page now.">Ya puedes cerrar esta página.</p>
  </div>
</main>

<footer class="pie">
  <a href="index.html" data-es="Inicio" data-en="Home">Inicio</a>
  <a href="privacy.html" data-es="Privacidad" data-en="Privacy">Privacidad</a>
  <a href="terms.html" data-es="Términos" data-en="Terms">Términos</a>
  <a href="mailto:soporte@halobra.com">soporte@halobra.com</a>
  <span class="derechos">&copy; 2026 Arias</span>
</footer>

<script>
(function(){
  var nodos=document.querySelectorAll('[data-es][data-en]');
  var botones=document.querySelectorAll('.idioma button');
  function aplicar(idioma){
    document.documentElement.lang=idioma;
    nodos.forEach(function(n){ n.innerHTML=n.getAttribute('data-'+idioma); });
    botones.forEach(function(b){ b.setAttribute('aria-pressed',String(b.dataset.set===idioma)); });
    try{ localStorage.setItem('halobra-idioma',idioma); }catch(e){}
  }
  var guardado=null;
  try{ guardado=localStorage.getItem('halobra-idioma'); }catch(e){}
  aplicar(guardado || ((navigator.language||'es').toLowerCase().indexOf('en')===0 ? 'en' : 'es'));
  botones.forEach(function(b){ b.addEventListener('click',function(){ aplicar(b.dataset.set); }); });
})();
</script>

</body>
</html>
